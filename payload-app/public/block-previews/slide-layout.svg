<svg width="250" height="160" viewBox="0 0 250 160" xmlns="http://www.w3.org/2000/svg">
  <rect width="250" height="160" fill="#f5f4f0"/>
  <!-- 40/60 split layout -->
  <!-- text column -->
  <rect x="12" y="20" width="85" height="8" rx="3" fill="#E8490F" opacity="0.5"/>
  <rect x="12" y="36" width="85" height="10" rx="3" fill="#111110" opacity="0.75"/>
  <rect x="12" y="52" width="85" height="6" rx="2" fill="#111110" opacity="0.22"/>
  <rect x="12" y="64" width="85" height="6" rx="2" fill="#111110" opacity="0.22"/>
  <rect x="12" y="76" width="60" height="6" rx="2" fill="#111110" opacity="0.22"/>
  <!-- divider -->
  <line x1="110" y1="12" x2="110" y2="148" stroke="#dddad0" stroke-width="1"/>
  <!-- image column -->
  <rect x="118" y="12" width="120" height="136" rx="10" fill="#eeece7"/>
  <rect x="140" y="50" width="76" height="56" rx="4" fill="#dddad0"/>
  <text x="125" y="157" font-family="system-ui,sans-serif" font-size="9" fill="#545450" text-anchor="middle">Slide Layout (40/60)</text>
</svg>
