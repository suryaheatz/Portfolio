  <rect x="32" y="52" width="70" height="32" rx="3" fill="#dddad0"/>
  <rect x="142" y="37" width="85" height="24" rx="3" fill="#dddad0"/>
  <rect x="142" y="75" width="85" height="24" rx="3" fill="#dddad0"/>
