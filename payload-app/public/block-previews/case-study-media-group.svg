  <rect x="12" y="32" width="110" height="72" rx="8" fill="#eeece7"/>
  <rect x="130" y="32" width="108" height="34" rx="8" fill="#eeece7"/>
  <rect x="130" y="70" width="108" height="34" rx="8" fill="#eeece7"/>
