<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SK Atlas — Grid Gateways &amp; Orange Ripple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400&family=Manrope:wght@400;500;600&family=DM+Serif+Display:ital@1&display=swap" rel="stylesheet">
<style>
  /* SK Design System tokens (read-only copy of the existing light-theme values; nothing is redefined or added to the system) */
  :root { --bg:#F5F4F0; --surface:#EEECE7; --ink:#111110; --ink-2:#545450; --ink-3:#6A6A64; --rule:#DDDAD0; --accent:#E8490F;
          --font-display:'Bricolage Grotesque', system-ui, sans-serif; --font-sans:'Manrope', system-ui, sans-serif; --font-mark:'DM Serif Display', Georgia, serif;   /* --font-mark: the SK wordmark only (logo lockup, not a text style) */
          --text-label:11px; --text-caption:12px; --text-body-sm:13px; --text-body:16px;
          --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px; --r-sm:6px; --r-md:12px;
          --ease-out:cubic-bezier(0.16,1,0.3,1); --t-mid:380ms; }
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:var(--bg); color:var(--ink); font:400 16px/1.5 var(--font-sans); -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; text-align:left; }
  button:disabled { cursor:default; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* ═══ ATLAS. Every position is derived from the 12-column canvas grid, six baseline rows and the rail divider (unchanged from Stage 1). ═══ */
  .atlas { --rail-w:clamp(168px, 10.4vw, 200px); --m:clamp(24px, 4.2vw, 80px); --g:clamp(12px, 1.25vw, 24px);
           --y0:216px; --pitch:88px; --axis:calc(100% * 6.5 / 12);
           --ring:clamp(88px, 7.1vw, 136px); --solid:clamp(32px, 3.6vw, 70px); --gate:clamp(28px, 1.9vw, 36px);
           --panel-w:clamp(340px, 26vw, 480px); --po:0;
           position:relative; min-height:max(760px, 100svh); overflow:hidden; background:var(--bg); }

  /* — rail — */
  .rail__div { position:absolute; left:var(--rail-w); top:0; bottom:0; width:1px; background:var(--rule); }
  .rail__brand { position:absolute; left:40px; top:40px; font:italic 400 40px/1 var(--font-mark); }
  .rail__brand::after { content:""; position:absolute; left:0; top:74px; width:120px; height:1px; background:var(--rule); }
  .rail__list { list-style:none; }
  .rail__item { position:absolute; left:0; width:var(--rail-w); height:44px; margin-top:-22px; top:calc(var(--y0) + var(--i) * var(--pitch)); padding-left:40px; display:flex; flex-direction:column; justify-content:center; }
  .rail__num { font:500 var(--text-label)/1.2 var(--font-sans); letter-spacing:0.14em; color:var(--ink-3); transition:color var(--t-mid); }
  .rail__name { font:500 var(--text-body-sm)/1.4 var(--font-sans); letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-2); transition:color var(--t-mid); }
  .rail__item:hover .rail__name { color:var(--ink); }
  .rail__item::after { content:""; position:absolute; top:50%; left:calc(100% + 0.5px); width:10px; height:10px; transform:translate(-50%, -50%); border:1.25px solid var(--ink-3); border-radius:50%; background:var(--bg); transition:border-color var(--t-mid); }
  .rail__item:hover::after { border-color:var(--ink); }
  .rail__item[aria-current="true"] .rail__num { color:var(--accent); }
  .rail__item[aria-current="true"] .rail__name { color:var(--ink); font-weight:600; }
  .rail__item[aria-current="true"]::after { width:12px; height:12px; border:0; background:var(--accent); box-shadow:0 0 0 4px var(--bg); }
  .rail__item[aria-current="true"]::before { content:""; position:absolute; left:calc(100% - 0.5px); top:calc(50% - 30px); width:2px; height:60px; background:var(--accent); }
  .rail__lead { position:absolute; right:9px; top:50%; width:calc(var(--rail-w) - 140px); height:1px; background:var(--accent); display:none; }
  .rail__item[aria-current="true"] .rail__lead { display:block; }

  /* — rail layout zones (desktop). Each item is its own CSS Grid with four zones, left to right:
        1 label column   sized by the label's REAL rendered width (fit-content), capped so the zones to its right always fit; longer labels wrap, then clamp to two lines
        2 corridor       reserved gutter (clearance) + the outgoing connector (.rail__lead); never narrower than clearance + minimum connector length
        3 axis           fixed track at the item's right edge: the divider and the navigation dot sit on it, so every dot shares one vertical axis
     The connector is a grid item that fills the corridor, so it can only ever start after the label's actual right edge plus the clearance. No per-label offsets exist. — */
  @media (min-width:1024px) {
    .rail { --rail-pad:clamp(24px, calc(var(--rail-w) - 160px), 40px); --clear:14px; --lead-min:12px; --axis-half:9px; }
    .rail__item { display:grid; grid-template-columns:fit-content(calc(100% - var(--clear) - var(--lead-min) - var(--axis-half))) minmax(calc(var(--clear) + var(--lead-min)), 1fr) var(--axis-half); grid-template-rows:auto auto; align-content:center; justify-items:start; height:auto; min-height:44px; margin-top:0; transform:translateY(-50%); padding-left:var(--rail-pad); text-align:left; }
    .rail__num { grid-column:1; grid-row:1; }
    .rail__name { grid-column:1; grid-row:2; max-width:100%; min-width:0; overflow:hidden; overflow-wrap:anywhere; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-clamp:2; }
    .rail__lead { position:static; grid-column:2; grid-row:1 / 3; align-self:center; justify-self:end; width:calc(100% - var(--clear)); max-width:max(var(--lead-min), calc(var(--rail-w) - 140px)); }   /* same length as before when there is room; shorter only as far as the label requires */
  }

  /* — layers: bg grid (guides + gateways) < tree (bridge + progression + preview) < temporary state < panel — */
  .grid { position:absolute; top:0; bottom:0; left:calc(var(--rail-w) + 1px); right:0; padding-inline:var(--m); display:grid; grid-template-columns:repeat(12, minmax(0, 1fr)); grid-template-rows:repeat(12, minmax(0, 1fr)); column-gap:var(--g); }
  @media (min-width:1200px) { .grid { right:calc(var(--panel-w) * var(--po)); } }     /* the canvas gives way to the open panel; every coordinate below is grid-derived, so alignment is preserved */
  .tree { position:absolute; inset:0; pointer-events:none; transform-origin:55% 50%; }
  .tree[hidden] { display:none; }
  .grid--tree, .grid--tmp { pointer-events:none; }
  .guide { grid-row:1 / -1; border-left:1px solid color-mix(in srgb, var(--rule) 55%, transparent); pointer-events:none; }
  .guide--end { border-left:0; border-right:1px solid color-mix(in srgb, var(--rule) 55%, transparent); }

  /* — bridge: divider → margin line → axis → Foundations ring — */
  .bridge { position:absolute; background:var(--accent); pointer-events:none; }
  .bridge--stub { left:calc(var(--rail-w) + 1px); width:calc(var(--m) + 1px); top:calc(var(--y0) - 1px); height:2px; }
  .bridge--rise { left:calc(var(--rail-w) + var(--m)); width:2px; top:calc(var(--y0) - 1px); height:calc(var(--axis) - var(--y0) + 2px); }
  .bridge--m { display:none; }

  /* — progression axis: 4 modules, each 3 columns wide, node centred — */
  .axis { grid-column:1 / -1; grid-row:7; align-self:center; height:0; display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); column-gap:var(--g); list-style:none; position:relative; }
  .mod { position:relative; height:0; }
  .node { position:absolute; left:50%; top:0; width:var(--ring); height:var(--ring); margin:calc(var(--ring) / -2) 0 0 calc(var(--ring) / -2); border-radius:50%; background:none; pointer-events:auto; }   /* the hit area keeps the full Stage 2B.1 size */
  .node__disc { --rest:1; position:absolute; inset:0; border-radius:50%; background:var(--bg); transform:scale(var(--rest)); transition:transform 520ms var(--ease-out), box-shadow var(--t-mid); will-change:transform; }
  @media (min-width:1024px) { .node__disc { --rest:0.5; } }                                   /* resting diameter = exactly 50% of the previous one; hover / focus / selected return it to 100% */
  .node__ring { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
  .node__ring circle, .node__ring line { fill:none; stroke:var(--ink); stroke-width:1.25; vector-effect:non-scaling-stroke; }   /* stroke stays 1.25px at every scale */
  /* node focus rings: a default node is a plain circle. Two concentric rings exist only on hover or keyboard focus (and never while a transition runs). */
  .node { --nrip:1; } @media (min-width:1024px) { .node { --nrip:0.5; } }
  .node__rip { position:absolute; left:50%; top:50%; width:calc(var(--ring) * var(--nrip)); height:calc(var(--ring) * var(--nrip)); margin:calc(var(--ring) * var(--nrip) / -2) 0 0 calc(var(--ring) * var(--nrip) / -2); border:1px solid var(--accent); border-radius:50%; opacity:0; pointer-events:none; }   /* same ring + motion as .gate__rip */
  .node__img { position:absolute; inset:11.76%; border-radius:50%; overflow:hidden; background:var(--surface); transition:transform var(--t-mid) var(--ease-out); }
  .node__img svg { display:block; width:100%; height:100%; }



  .node__label { position:absolute; left:calc(50% - var(--ring) / 2); bottom:calc(var(--ring) / 2 + 22px); width:max-content; display:flex; flex-direction:column; justify-content:flex-end; height:calc(var(--text-caption) * 1.2 + 4px + clamp(20px, 1.5vw, 28px) * 2.3); pointer-events:none; }   /* fixed number + two-line region: its bottom edge is the anchor, so a second line grows upward and the circle never moves; width is set per label by fitLabels() */
  .node__num { display:block; font:500 var(--text-caption)/1.2 var(--font-sans); letter-spacing:0.14em; color:var(--ink-3); }
  .node__name { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-clamp:2; overflow:hidden; overflow-wrap:break-word; margin-top:4px; font:300 clamp(20px, 1.5vw, 28px)/1.15 var(--font-display); letter-spacing:-0.01em; color:var(--ink); }
  /* node states: hover = the image disc grows a little inside a fixed ring (nothing moves); selected = one extra outer stroke; inactive = the others recede */
  @media (hover:hover) { .node:hover { z-index:4; } .node:hover .node__disc { transform:scale(1); } .node:hover .node__img { transform:scale(1.07); } }
  .node:focus-visible { z-index:4; } .node:focus-visible .node__disc { transform:scale(1); }
  .node:focus-visible .node__img { transform:scale(1.07); }
  .node[aria-pressed="true"] .node__disc { transform:scale(1); box-shadow:0 0 0 1.5px var(--ink); }

  .node, .node__label { transition:opacity var(--t-mid); }
  .node__num { transition:color var(--t-mid); }
  .mod.is-pv .node__num { color:#BC3A0B; }                                                 /* the hovered node and its preview share one accent */
  :is(.axis, .grid--net)[data-sel] .mod:not(.is-sel) :is(.node, .node__label) { opacity:0.5; }          /* the pathway and bridge never dim */

  /* technical pathway */
  .seg { position:absolute; top:-0.5px; height:1px; background-repeat:no-repeat; pointer-events:none;
         background-image:linear-gradient(var(--ink), var(--ink)), repeating-linear-gradient(90deg, var(--ink) 0 8px, transparent 8px 14px); background-size:var(--solid) 100%, calc(100% - var(--solid)) 100%; }
  .seg--r { left:calc(50% + var(--ring) / 4); right:calc(var(--g) / -2); background-position:left center, right center; }
  .seg--l { left:calc(var(--g) / -2); right:calc(50% + var(--ring) / 4); background-position:right center, left center; }
  .seg--bridge { left:-1px; top:-1px; height:2px; background:var(--accent); }

  /* — hover preview: ONE grid-aligned region per category (data.previewRegions). Empty at rest. — */
  .grid--pv { z-index:5; pointer-events:none; }
  .pv { position:absolute; inset:0; pointer-events:none; }                                   /* overlay; each preview layer is placed inside the category's preview region by pickZone() */
  .pvz { display:none; }
  .pv__layer { position:absolute; left:0; top:0; clip-path:inset(0 0 0 100%); overflow:hidden; will-change:clip-path; border-radius:var(--r-sm); }
  .pv__layer--sum { display:flex; flex-direction:column; }
  .pv__pic { position:relative; flex:none; overflow:hidden; border-radius:var(--r-sm); }
  .pv__layer--sum .pv__cap { position:static; padding:10px 0 4px; background:none; }
  .pv__sum { margin:0; font:400 var(--text-body-sm)/1.5 var(--font-sans); color:var(--ink-2); }
  .pv__id { color:#BC3A0B; font-weight:600; }
  .pv__layer.is-narrow .pv__cap span:last-child { display:none; }
  .pv__img { position:absolute; left:-10%; top:0; width:120%; height:100%; will-change:transform; }
  .pv__img svg { display:block; width:100%; height:100%; }
  .pv__cap { position:absolute; left:0; right:0; bottom:0; padding:10px 14px; display:flex; justify-content:space-between; gap:12px; background:var(--bg); font:500 var(--text-label)/1.3 var(--font-sans); letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-2); }
  .pv__cap span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .pv__cap span:first-child { white-space:normal; overflow:visible; text-overflow:clip; }          /* the preview always shows the full title */
  .pv__cap span:last-child { color:var(--ink-3); }

  /* — background gateways: stroke-only, unlabeled at rest. Hover/focus: ripple + faded name and descriptor, behind the career layer. — */
  .grid--bg { z-index:0; }
  .gate { position:relative; place-self:center; width:44px; height:44px; display:grid; place-items:center; z-index:1; }
  .gate__art { display:grid; place-items:center; width:100%; height:100%; opacity:0.85; transition:opacity 0.45s var(--ease-out); }
  .gate svg { width:var(--gate); height:var(--gate); overflow:visible; transform:rotate(var(--rot, 0deg)); }
  .gate circle, .gate path { fill:none; stroke:var(--ink-3); stroke-width:1; vector-effect:non-scaling-stroke; }
  .gate .g1 { opacity:0.38; } .gate .g2 { opacity:0.26; } .gate .g3 { opacity:0.2; }
  .gate__rip { position:absolute; left:50%; top:50%; width:var(--gate); height:var(--gate); margin:calc(var(--gate) / -2) 0 0 calc(var(--gate) / -2); border:1px solid var(--accent); border-radius:50%; opacity:0; pointer-events:none; }
  .gate__txt { position:absolute; top:50%; left:calc(100% + 6px); transform:translate(-6px, -50%); opacity:0; white-space:nowrap; pointer-events:none; transition:opacity 0.5s var(--ease-out), transform 0.5s var(--ease-out); }
  .gate--left .gate__txt { left:auto; right:calc(100% + 6px); text-align:right; transform:translate(6px, -50%); }
  .gate__name { display:block; font:500 var(--text-label)/1.3 var(--font-sans); letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-3); }
  .gate__desc { display:block; margin-top:2px; font:400 var(--text-caption)/1.4 var(--font-sans); letter-spacing:0.03em; color:var(--ink-3); opacity:0.85; }
  .gate:is(:hover, :focus-visible) .gate__art { opacity:1; }
  .gate:is(:hover, :focus-visible) .gate__txt { opacity:0.9; transform:translate(0, -50%); }
  .gate:is(:hover, :focus-visible) circle.g1 { opacity:0.75; }

  /* — temporary state for categories that have no approved content yet (no invented content) — */
  .tmp { grid-column:4 / span 6; grid-row:7; align-self:center; }
  .grid[hidden] { display:none; }
  .tmp__k { display:block; font:500 var(--text-label)/1.4 var(--font-sans); letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-3); }
  .tmp__t { margin-top:var(--sp-3); font:400 var(--text-body)/1.6 var(--font-sans); color:var(--ink-2); max-width:44ch; }

  /* — detail panel (Adaptive Editorial Panel): fixed right on desktop, bottom sheet on mobile — */
  .panel { position:fixed; z-index:40; top:0; right:0; bottom:0; width:var(--panel-w); background:var(--bg); border-left:1px solid var(--rule); display:flex; flex-direction:column; visibility:hidden; }
  /* elevation (desktop): the panel is a sheet above the canvas. Hairline = the existing rule border; the soft shadow reuses the Design System's shadow-frame-mobile recipe (rgba(0,0,0,0.12), 40px blur), turned to fall on the left edge only. No new colours. */
  @media (min-width:1024px) { .panel { box-shadow:-8px 0 40px rgba(0,0,0,0.12); } .panel .pn__body > .pn__media { flex:none; width:min(100%, calc(42vh * var(--arn, 1.3333))); } }   /* media slot keeps the asset's aspect ratio (no crop) */
  .panel[data-open] { visibility:visible; }
  .pn__head { display:flex; justify-content:space-between; align-items:center; padding:var(--sp-5) var(--sp-6) var(--sp-4); border-bottom:1px solid var(--rule); }
  .pn__idx { font:500 var(--text-label)/1.2 var(--font-sans); letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-3); }
  .pn__close { width:44px; height:44px; margin:-10px -12px -10px 0; display:grid; place-items:center; border-radius:50%; }
  .pn__close svg { width:16px; height:16px; stroke:var(--ink); stroke-width:1.5; fill:none; }
  .pn__close:hover { background:var(--surface); }
  .pn__body { flex:1; min-height:0; overflow-y:auto; padding:var(--sp-6); display:flex; flex-direction:column; gap:var(--sp-5); }
  .pn__media { aspect-ratio:var(--ar, 4 / 3); max-height:42vh; align-self:flex-start; width:100%; border-radius:var(--r-sm); overflow:hidden; background:var(--surface); }
  .pn__media svg { display:block; width:100%; height:100%; }
  .pn__cap { margin-top:calc(var(--sp-3) * -1); font:400 var(--text-caption)/1.4 var(--font-sans); letter-spacing:0.03em; color:var(--ink-3); }
  .pn__title { font:300 clamp(32px, 2.6vw, 44px)/1.08 var(--font-display); letter-spacing:-0.02em; outline-offset:6px; }
  .pn__flag { font:500 var(--text-label)/1.3 var(--font-sans); letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-3); }
  .pn__flag[hidden] { display:none; }
  .pn__copy { font:400 var(--text-body)/1.6 var(--font-sans); color:var(--ink-2); }
  .pn__meta { display:grid; grid-template-columns:auto 1fr; column-gap:var(--sp-6); row-gap:var(--sp-3); padding-top:var(--sp-4); border-top:1px solid var(--rule); }
  .pn__meta dt { font:500 var(--text-label)/1.6 var(--font-sans); letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-3); }
  .pn__meta dd { font:400 var(--text-body-sm)/1.55 var(--font-sans); color:var(--ink-3); }
  .pn__nav { display:flex; justify-content:space-between; gap:var(--sp-4); padding:var(--sp-4) var(--sp-6); border-top:1px solid var(--rule); }
  .pn__btn { min-height:44px; display:flex; flex-direction:column; justify-content:center; padding:0 var(--sp-3); margin-inline:calc(var(--sp-3) * -1); border-radius:var(--r-sm); }
  .pn__btn[data-dir="next"] { text-align:right; align-items:flex-end; }
  .pn__btn small { font:500 var(--text-label)/1.3 var(--font-sans); letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-3); }
  .pn__btn span { font:500 var(--text-body-sm)/1.3 var(--font-sans); }
  .pn__btn:hover:not(:disabled) { background:var(--surface); }
  .pn__btn:disabled { opacity:0.35; }

  /* — network layers: every category except Practice. Same nodes, labels and connector language, placed from data on the 12-column grid. — */
  .grid--net { pointer-events:none; z-index:2; }
  .net__svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
  .net__svg path { fill:none; stroke:var(--ink); stroke-width:1; }
  .net__svg path.d { stroke-dasharray:8 6; }
  .net__svg path.br { stroke:var(--accent); stroke-width:2; }                       /* the bridge: rail item → first node, same accent line as Practice */
  .grid--net .mod { align-self:center; }
  .grid--net .node { pointer-events:auto; }
  .node__label--b { bottom:auto; top:calc(var(--ring) / 2 + 22px); justify-content:flex-start; }          /* the one label rule, mirrored: used only when a connector leaves the node upward (derived, never configured) */
  .net__tag { grid-column:1 / span 5; grid-row:12; align-self:end; padding-bottom:var(--sp-6); font:500 var(--text-label)/1.5 var(--font-sans); letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-3); }

  /* — spatial transition surface: the chosen gateway's own rings, drawn above the layers, expand past the canvas — */
  .portal { position:absolute; top:0; bottom:0; left:calc(var(--rail-w) + 1px); right:0; z-index:30; pointer-events:none; overflow:hidden; }
  .portal[hidden] { display:none; }
  .portal svg { position:absolute; inset:0; width:100%; height:100%; color:var(--ink); overflow:hidden; }
  .portal svg path, .portal svg circle { fill:none; stroke:currentColor; stroke-width:1; vector-effect:non-scaling-stroke; }
  .portal .g1 { opacity:0.6; } .portal .g2 { opacity:0.32; } .portal .g3 { opacity:0.26; }
  .portal .g0 { display:none; }
  .is-transit .gate:not(.is-origin) .gate__art { opacity:0.3; }
  .is-transit .gate__txt { opacity:0 !important; }
  .is-transit .node, .is-transit .node__label, .is-transit .node__disc { transition:none !important; pointer-events:none; }
  .is-transit .node__rip { display:none; }
  @media (prefers-reduced-motion:reduce) { .node__img, .node, .node__disc, .node__disc::before, .node__disc::after, .node__label, .gate__art, .gate__txt { transition-duration:0.01ms; } }

  /* — below 1024px: rail becomes a top strip, progression turns vertical, details open as a bottom sheet — */
  @media (max-width:1023px) {
    .portal { display:none; }
    .atlas { --ring:72px; --m:20px; --g:16px; --solid:0px; min-height:0; padding-bottom:var(--sp-10); display:flex; flex-direction:column; }
    .atlas[data-sheet] { padding-bottom:72svh; }
    .rail__div, .bridge--stub, .bridge--rise, .rail__brand::after, .rail__lead, .rail__item[aria-current="true"] .rail__lead, .guide, .pv, .gate__txt { display:none; }
    .rail { position:relative; padding:var(--sp-5) var(--m) 0; border-bottom:1px solid var(--rule); }

  window.ATLAS = { op: () => S.op, zone: () => S.zone, curSet, pickZone, tl: () => S.tl, state: S, goTo, openPanel, closePanel, previewIn, previewHide, slots, tweens: () => gsap.globalTimeline.getChildren(true, true, true).length };   // test hooks
})();
</script>
