name: Run Payload Migrations

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Neon branch to run migrations against'
        required: false
        default: 'preview/integration/payload-cms'

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payload-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: integration/payload-cms

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Create .env
        run: |
          printf 'DATABASE_URI=%s\n' "${{ secrets.DATABASE_URI }}" > .env
          printf 'PAYLOAD_SECRET=%s\n' "${{ secrets.PAYLOAD_SECRET }}" >> .env
          printf 'S3_ENDPOINT=%s\n' "${{ secrets.S3_ENDPOINT }}" >> .env
          printf 'S3_ACCESS_KEY_ID=%s\n' "${{ secrets.S3_ACCESS_KEY_ID }}" >> .env
          printf 'S3_SECRET_ACCESS_KEY=%s\n' "${{ secrets.S3_SECRET_ACCESS_KEY }}" >> .env

      - name: Run migrations
        run: pnpm payload migrate
