backend:
  name: github
  repo: suryaheatz/Portfolio
  branch: main
  base_url: https://surya-zf-centronic.vercel.app
  auth_endpoint: api/auth

media_folder: public/images
public_folder: /public/images

collections:

  # ══════════════════════════════════════════════════════════════════
  # HOMEPAGE (not yet built — schema ready for when it is)
  # Writes to _cms/homepage.json
  # ══════════════════════════════════════════════════════════════════
  - name: homepage
    label: Homepage
    files:
      - name: homepage
        label: Homepage Content
        file: _cms/homepage.json
        fields:
          # ── Hero ──────────────────────────────────────────────────
          - label: Hero Headline
            name: headline
            widget: string
            hint: "Main h1 — shown in .hero-scroll-text (DM Serif Display, italic)"
          - label: Hero Subline
            name: subline
            widget: text
            hint: "Paragraph under the headline — shown in .hero-subtitle"
          - label: Hero Image (alt)
            name: heroImageAlt
            widget: string
            required: false
            hint: "Alt text for the hero background image"

          # ── About blurb ───────────────────────────────────────────
          - label: About Blurb
            name: about
            widget: markdown
            hint: "Short bio text in the brief-centre section"

          # ── Works Grid ────────────────────────────────────────────
          - label: Works Grid
            name: works
            widget: list
            hint: "Each card in the homepage works / case-study grid"
            fields:
              - label: Title
                name: title
                widget: string
              - label: Slug / URL
                name: slug
                widget: string
                hint: "e.g. zf-centronic or haptix — links to /case-studies/<slug>/"
              - label: Year
                name: year
                widget: string
              - label: Tags
                name: tags
                widget: list
                field:
                  label: Tag
                  name: tag
                  widget: string
              - label: Cover Image
                name: coverImage
                widget: image
                hint: "Displayed with object-fit:cover inside the works card"
              - label: Cover Image Alt
                name: coverImageAlt
                widget: string
                required: false

  # ══════════════════════════════════════════════════════════════════
  # ZF CENTRONIC — site-wide config + per-chapter content
  # Template: Template 01 (pin-over-pin), bento §22, quote 2-up §23,
  #           slide layout §24
  # ══════════════════════════════════════════════════════════════════
  - name: zf-site
    label: "ZF Centronic — Site Config"
    files:
      - name: zf-config
        label: Site Config
        file: _cms/site-config.json
        fields:
          - label: Case Study Title
            name: csTitle
            widget: string
            hint: "h1 in .hero-scroll-text"
          - label: Case Study Subtitle
            name: csSubtitle
            widget: text
            hint: "Secondary text in .hero-subtitle"

          # ── Progress rail chapters ─────────────────────────────────
          - label: Chapters
            name: chapters
            widget: list
            hint: "Drives the progress rail (.cs-rail-dot) and chapter nav"
            fields:
              - label: Number
                name: num
                widget: string
                hint: "e.g. 01, 02 — shown in the rail dot tooltip"
              - label: Anchor ID
                name: id
                widget: string
                hint: "Matches id= on the section element, e.g. cs-context"
              - label: Title
                name: title
                widget: string
              - label: Description
                name: desc
                widget: string
                hint: "Short phrase shown in bottom-sheet drawer on mobile"

  - name: zf-chapters
    label: "ZF Centronic — Chapter Content"
    folder: _cms/zf
    create: false
    slug: "{{slug}}"
    label_singular: Chapter
    fields:
      - label: Chapter ID
        name: chapterId
        widget: string
        hint: "Must match the anchor id in index.html, e.g. cs-context"
      - label: Chapter Title
        name: title
        widget: string

      # ── Prose body ────────────────────────────────────────────────
      - label: Body Copy
        name: body
        widget: markdown
        hint: "Main prose in .prose — paragraphs, strong, links"
        required: false

      # ── Bento Grid cells (DS §22 — cs-bento-cell) ─────────────────
      - label: Bento Images
        name: bentoCells
        widget: list
        required: false
        hint: "Each item = one .cs-bento-cell. Images are fixed windows (object-fit:cover)."
        fields:
          - label: Image
            name: src
            widget: image
          - label: Caption
            name: caption
            widget: string
            required: false
            hint: "Shown in .cs-bento-caption on hover"
          - label: Alt Text
            name: alt
            widget: string
            required: false

      # ── Quote 2-up pairs (DS §23 — pq-pair, pq-quote-text, pq-attr) ──
      - label: Pull Quote Pairs
        name: pqPairs
        widget: list
        required: false
        hint: "Each item = one .pq-pair (2 quote cards side by side)"
        fields:
          - label: Left Quote
            name: left
            widget: object
            fields:
              - label: Quote Text
                name: pqQuoteText
                widget: text
                hint: "Italic serif text in .pq-quote-text (clamped to 3 lines)"
              - label: Attribution
                name: pqAttr
                widget: string
                hint: "Shown in .pq-attr — name, role or source"
          - label: Right Quote
            name: right
            widget: object
            fields:
              - label: Quote Text
                name: pqQuoteText
                widget: text
              - label: Attribution
                name: pqAttr
                widget: string

      # ── Slide layout blocks (DS §24 — sk-slide, sk-slide-text, sk-slide-image) ──
      - label: Slide Blocks
        name: skSlides
        widget: list
        required: false
        hint: "Each item = one .sk-slide (2fr text / 3fr image grid)"
        fields:
          - label: Slide Text (sk-slide-text)
            name: skSlideText
            widget: object
            fields:
              - label: Label (eyebrow)
                name: label
                widget: string
                required: false
              - label: Heading
                name: heading
                widget: string
              - label: Body
                name: body
                widget: text
          - label: Slide Image (sk-slide-image)
            name: skSlideImage
            widget: image
            hint: "Displayed with object-fit:cover in .sk-slide-image"
          - label: Image Alt
            name: skSlideImageAlt
            widget: string
            required: false
          - label: Image Position
            name: imagePosition
            widget: select
            options: [right, left]
            default: right
            hint: "right = image on the right (default); left = image leads"

  # ══════════════════════════════════════════════════════════════════
  # HAPTIX — hero fields + per-section content
  # Partial DS adoption: gallery + prose now; bento/pq/sk-slide ready
  # ══════════════════════════════════════════════════════════════════
  - name: haptix
    label: "Haptix Case Study"
    files:
      - name: haptix-hero
        label: Haptix — Hero
        file: _cms/haptix/hero.json
        fields:
          - label: Headline
            name: headline
            widget: string
            hint: "h1 in .h-hero (DM Serif Display)"
          - label: Lead paragraph
            name: lead
            widget: text
            hint: "Long descriptive paragraph below the headline (.lead)"
          - label: Metatag
            name: metatag
            widget: string
            hint: "e.g. 'UX Design · Jan–Jul 2020 · ZF India Technology Centre · HMI' — shown in .metatag"
          - label: Skill chips
            name: chips
            widget: list
            hint: "Each item = one .chip — e.g. 'interaction design', 'UI design'"
            field:
              label: Chip
              name: chip
              widget: string
          - label: Hero figure image
            name: heroFigSrc
            widget: image
            hint: "Displayed in .hero-fig — shown at full width with border-radius"
          - label: Hero figure alt text
            name: heroFigAlt
            widget: string
            required: false

      - name: haptix-scope
        label: Haptix — Scope Card
        file: _cms/haptix/scope.json
        fields:
          - label: Brief heading
            name: briefHeading
            widget: string
          - label: Brief body
            name: briefBody
            widget: text
          - label: Scope items
            name: scopeItems
            widget: list
            hint: "Each .scope-box — key/value pair on the dark scope card"
            fields:
              - label: Key
                name: k
                widget: string
                hint: "Label text (.scope-box .k) — e.g. 'Timeline'"
              - label: Value
                name: v
                widget: string
                hint: "Value text (.scope-box .v) — e.g. 'Jan–Jul 2020'"

  - name: haptix-sections
    label: "Haptix — Case Study Sections"
    folder: _cms/haptix/sections
    create: false
    slug: "{{slug}}"
    label_singular: Section
    fields:
      - label: Section ID
        name: sectionId
        widget: string
        hint: "Matches id= on the section element"
      - label: Section Title
        name: title
        widget: string

      # ── Prose ─────────────────────────────────────────────────────
      - label: Body Copy
        name: body
        widget: markdown
        required: false

      # ── Gallery images ─────────────────────────────────────────────
      - label: Gallery Images
        name: gallery
        widget: list
        required: false
        hint: "Images shown in .gal grid (.gi items)"
        fields:
          - label: Image
            name: src
            widget: image
          - label: Alt Text
            name: alt
            widget: string
            required: false
          - label: Tag / Label
            name: tag
            widget: string
            required: false
            hint: "Short label shown on the image in .gi .tag"

      # ── Bento cells (DS §22) — for future DS adoption ──────────────
      - label: Bento Images (DS §22)
        name: bentoCells
        widget: list
        required: false
        hint: "Each item = one .cs-bento-cell — optional, for DS adoption"
        fields:
          - label: Image
            name: src
            widget: image
          - label: Caption
            name: caption
            widget: string
            required: false
          - label: Alt Text
            name: alt
            widget: string
            required: false

      # ── Pull quote pairs (DS §23) ──────────────────────────────────
      - label: Pull Quote Pairs (DS §23)
        name: pqPairs
        widget: list
        required: false
        fields:
          - label: Left Quote
            name: left
            widget: object
            fields:
              - label: Quote Text
                name: pqQuoteText
                widget: text
              - label: Attribution
                name: pqAttr
                widget: string
          - label: Right Quote
            name: right
            widget: object
            fields:
              - label: Quote Text
                name: pqQuoteText
                widget: text
              - label: Attribution
                name: pqAttr
                widget: string

      # ── Slide blocks (DS §24) ──────────────────────────────────────
      - label: Slide Blocks (DS §24)
        name: skSlides
        widget: list
        required: false
        fields:
          - label: Slide Text (sk-slide-text)
            name: skSlideText
            widget: object
            fields:
              - label: Label
                name: label
                widget: string
                required: false
              - label: Heading
                name: heading
                widget: string
              - label: Body
                name: body
                widget: text
          - label: Slide Image (sk-slide-image)
            name: skSlideImage
            widget: image
          - label: Image Alt
            name: skSlideImageAlt
            widget: string
            required: false
