backend:
  name: github
  repo: suryaheatz/Portfolio
  branch: main
  base_url: https://surya-zf-centronic.vercel.app
  auth_endpoint: api/auth

media_folder: public/images
public_folder: /public/images

collections:

  # ══════════════════════════════════════════════════════════════════
  # HOMEPAGE
  # Writes to _cms/homepage.json
  # ══════════════════════════════════════════════════════════════════
  - name: homepage
    label: Homepage
    files:
      - name: homepage
        label: Homepage Content
        file: _cms/homepage.json
        fields:
          - label: Hero Headline
            name: headline
            widget: string
          - label: Hero Subline
            name: subline
            widget: text
          - label: About Blurb
            name: about
            widget: markdown
          - label: Works Grid
            name: works
            widget: list
            fields:
              - label: Title
                name: title
                widget: string
              - label: Slug / URL
                name: slug
                widget: string
                hint: "e.g. haptix — links to /case-studies/<slug>/"
              - label: Year
                name: year
                widget: string
              - label: Tags
                name: tags
                widget: list
                field:
                  label: Tag
                  name: tag
                  widget: string
              - label: Cover Image
                name: coverImage
                widget: image
              - label: Cover Image Alt
                name: coverImageAlt
                widget: string
                required: false

  # ══════════════════════════════════════════════════════════════════
  # CASE STUDIES — one document per case study, any number of sections
  # Folder: _cms/case-studies/ — add a new file = new case study
  # Template variants: narrative | image-only
  # ══════════════════════════════════════════════════════════════════
  - name: case-studies
    label: Case Studies
    label_singular: Case Study
    folder: _cms/case-studies
    create: true
    extension: json
    format: json
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}}"
    fields:

      # ── Meta ──────────────────────────────────────────────────────
      - label: Title
        name: title
        widget: string
        hint: "Used as the page <title> and in the CMS list"

      - label: Slug
        name: slug
        widget: string
        hint: "URL-safe identifier, e.g. haptix. Must match the folder name under /case-studies/"

      - label: Template
        name: template
        widget: select
        options:
          - { label: "Narrative (text + mixed content)", value: narrative }
          - { label: "Image-only (gallery/bento, no prose)", value: image-only }
        default: narrative
        hint: "Controls which fields are active. Image-only hides prose fields in the fetch layer."

      # ── Hero ──────────────────────────────────────────────────────
      - label: Hero
        name: hero
        widget: object
        fields:
          - label: Title
            name: title
            widget: string
          - label: Subtitle
            name: subtitle
            widget: text
            required: false
          - label: Hero Image
            name: image
            widget: image
          - label: Image Alt
            name: image_alt
            widget: string
            required: false
          - label: Meta Tags
            name: meta_tags
            widget: list
            hint: "Short tags shown above the title (discipline, date, company)"
            field:
              label: Tag
              name: tag
              widget: string
          - label: Logo Slots
            name: logos
            widget: list
            hint: "Client / collaborator names shown as logo placeholders"
            field:
              label: Name
              name: name
              widget: string
          - label: Skill Chips
            name: chips
            widget: list
            hint: "Skill tags shown under the title"
            field:
              label: Chip
              name: chip
              widget: string

      # ── Brief ─────────────────────────────────────────────────────
      - label: Brief
        name: brief
        widget: object
        hint: "Sticky card that scrolls over the hero image"
        fields:
          - label: Paragraphs
            name: paragraphs
            widget: list
            hint: "Each item = one paragraph of brief text"
            field:
              label: Paragraph
              name: paragraph
              widget: text

      # ── Scope ─────────────────────────────────────────────────────
      - label: Scope
        name: scope
        widget: object
        hint: "Dark card showing project metadata"
        fields:
          - label: Where
            name: where
            widget: string
          - label: When
            name: when
            widget: string
          - label: My Role
            name: role
            widget: string
          - label: Deliverables
            name: deliverables
            widget: string
          - label: Scope Chips
            name: chips
            widget: list
            field:
              label: Chip
              name: chip
              widget: string

      # ── Prototype (optional) ──────────────────────────────────────
      - label: Prototype
        name: prototype
        widget: object
        required: false
        hint: "Interactive embed section — toggle off to hide"
        fields:
          - label: Show Prototype Section
            name: enabled
            widget: boolean
            default: false
          - label: Eyebrow
            name: eyebrow
            widget: string
            required: false
          - label: Heading
            name: heading
            widget: string
            required: false
          - label: Body
            name: body
            widget: text
            required: false
          - label: Prototype iframe src
            name: src
            widget: string
            required: false
            hint: "Relative path to prototype/index.html"
          - label: Version Labels
            name: versions
            widget: list
            required: false
            hint: "e.g. Desktop view, Phone view"
            field:
              label: Label
              name: label
              widget: string

      # ── Body Sections ─────────────────────────────────────────────
      # Each section has an `enabled` toggle — off = hidden on the page
      # and skipped in the chapter rail.
      # ─────────────────────────────────────────────────────────────
      - label: Sections
        name: sections
        widget: list
        hint: "Ordered body sections. Toggle 'Show section' to hide one without deleting it."
        fields:

          - label: Show Section
            name: enabled
            widget: boolean
            default: true
            hint: "Toggle off to hide this section on the live page and remove it from the chapter rail."

          - label: Section ID (anchor slug)
            name: id
            widget: string
            hint: "URL anchor, e.g. research. Must be lowercase, no spaces."

          - label: Eyebrow
            name: eyebrow
            widget: string
            required: false
            hint: "Small label above the heading, e.g. '01 · Research'"

          - label: Heading
            name: heading
            widget: string
            required: false

          - label: Layout
            name: layout
            widget: select
            options:
              - { label: "Prose", value: prose }
              - { label: "Prose + bulleted list", value: prose-list }
              - { label: "Prose + image aside", value: prose-with-aside }
              - { label: "Prose + gallery", value: prose-gallery }
              - { label: "Prose + chips", value: prose-chips }
              - { label: "Prose + accordion", value: prose-accordion }
              - { label: "Chapter list (process overview)", value: chapter-list }
              - { label: "Table", value: table }
              - { label: "Table + gallery", value: table-gallery }
              - { label: "Gallery", value: gallery }
              - { label: "Bento grid (DS §22)", value: bento }
              - { label: "Quote 2-up (DS §23)", value: quote2up }
              - { label: "Slide layout (DS §24)", value: slide }
              - { label: "Accordion", value: accordion }
              - { label: "Chips", value: chips }
              - { label: "Key dates + tabs", value: key-dates-tabs }
              - { label: "Impact list", value: impact-list }
            hint: "Choose a DS component layout for this section."

          # ── Content object — all layouts share this one object ─────
          # Unused fields for the chosen layout are simply ignored
          # by the fetch layer.
          - label: Content
            name: content
            widget: object
            hint: "Fill only the fields that apply to the chosen layout."
            fields:

              # prose / prose-list / prose-gallery / prose-chips / impact-list
              - label: Body (prose / markdown)
                name: body
                widget: markdown
                required: false

              # prose-list / impact-list
              - label: List Items
                name: list_items
                widget: list
                required: false
                hint: "Bulleted / plain list items"
                field:
                  label: Item
                  name: item
                  widget: text

              # gallery / prose-gallery / table-gallery
              - label: Gallery Images
                name: images
                widget: list
                required: false
                fields:
                  - label: Image
                    name: src
                    widget: image
                  - label: Alt Text
                    name: alt
                    widget: string
                    required: false
                  - label: Caption
                    name: caption
                    widget: string
                    required: false
                  - label: Tag / Label
                    name: tag
                    widget: string
                    required: false
                    hint: "Short overlay label, e.g. '01 · idle' or 'GIF'"

              - label: Gallery Columns
                name: gallery_columns
                widget: number
                required: false
                default: 4
                hint: "Number of columns in the gallery grid (2, 3 or 4)"

              - label: Gallery Caption
                name: gallery_caption
                widget: string
                required: false

              # table / table-gallery / hardware
              - label: Table Headers
                name: headers
                widget: list
                required: false
                hint: "Column header labels"
                field:
                  label: Header
                  name: header
                  widget: string

              - label: Table Rows
                name: rows
                widget: list
                required: false
                hint: "Each row is a list of cell values"
                fields:
                  - label: Cells (comma-separated or list)
                    name: cells
                    widget: list
                    field:
                      label: Cell
                      name: cell
                      widget: string

              - label: Table Caption
                name: caption
                widget: string
                required: false

              # prose-with-aside
              - label: Aside Image
                name: aside_image
                widget: image
                required: false

              - label: Aside Image Alt
                name: aside_image_alt
                widget: string
                required: false

              # bento (DS §22)
              - label: Bento Cells
                name: cells
                widget: list
                required: false
                hint: "Each item = one bento cell. The grid variant (BENTO-N) is chosen automatically by cell count."
                fields:
                  - label: Image
                    name: src
                    widget: image
                  - label: Caption
                    name: caption
                    widget: string
                    required: false
                  - label: Alt Text
                    name: alt
                    widget: string
                    required: false

              # quote2up (DS §23)
              - label: Quote Pairs
                name: quotes
                widget: list
                required: false
                hint: "Two quotes per pair, shown side by side"
                fields:
                  - label: Quote Text
                    name: text
                    widget: text
                  - label: Attribution
                    name: attribution
                    widget: string

              # slide (DS §24)
              - label: Slides
                name: slides
                widget: list
                required: false
                fields:
                  - label: Eyebrow
                    name: eyebrow
                    widget: string
                    required: false
                  - label: Heading
                    name: heading
                    widget: string
                  - label: Body
                    name: body
                    widget: text
                  - label: Image
                    name: image
                    widget: image
                    required: false
                  - label: Image Alt
                    name: image_alt
                    widget: string
                    required: false

              # accordion / prose-accordion
              - label: Accordion Items
                name: accordion
                widget: list
                required: false
                fields:
                  - label: Label
                    name: label
                    widget: string
                  - label: Body
                    name: body
                    widget: markdown

              # chips
              - label: Chips
                name: chips
                widget: list
                required: false
                hint: "Plain chip list OR object with label + accent flag"
                fields:
                  - label: Label
                    name: label
                    widget: string
                  - label: Accent (orange)
                    name: accent
                    widget: boolean
                    default: false

              # key-dates-tabs
              - label: Key Dates Label
                name: key_dates_label
                widget: string
                required: false

              - label: Key Dates
                name: key_dates
                widget: list
                required: false
                fields:
                  - label: Date Label
                    name: label
                    widget: string
                    hint: "e.g. '24 February'"
                  - label: Event
                    name: event
                    widget: string

              - label: Tabs
                name: tabs
                widget: list
                required: false
                hint: "Tab panels inside this section"
                fields:
                  - label: Tab Label
                    name: label
                    widget: string
                  - label: Body
                    name: body
                    widget: markdown
                    required: false
                  - label: Image
                    name: image
                    widget: image
                    required: false
                  - label: Image Alt
                    name: image_alt
                    widget: string
                    required: false
                  - label: Image Caption
                    name: image_caption
                    widget: string
                    required: false

              # chapter-list
              - label: Chapter List Items
                name: chapter_items
                widget: list
                required: false
                hint: "Process overview list (numbered links to sections)"
                fields:
                  - label: Number
                    name: number
                    widget: string
                  - label: Label
                    name: label
                    widget: string
                  - label: Target Section ID
                    name: target
                    widget: string
                  - label: Description
                    name: description
                    widget: text
                    required: false
